<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Map Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #f5f5f0; overflow: hidden; }

  .viewer {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
  }
  .viewer.grabbing { cursor: grabbing; }

  .viewer img {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
    user-select: none;
    -webkit-user-drag: none;
    will-change: transform;
  }

  .controls {
    position: absolute;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    z-index: 10;
  }
  .controls button {
    width: 36px;
    height: 36px;
    background: #fff;
    border: 1px solid #ccc;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s;
  }
  .controls button:hover { background: #eee; }
  .controls button:first-child { border-bottom: none; }

  .loading {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-family: monospace;
    font-size: 14px;
    letter-spacing: 2px;
    color: #999;
  }
</style>
</head>
<body>

<div class="viewer" id="viewer">
  <div class="loading" id="loading">loading...</div>
  <img id="map" alt="Map">
  <div class="controls">
    <button id="zoomIn">+</button>
    <button id="zoomOut">–</button>
  </div>
</div>

<script>
(function() {
  var IMAGE_URL = 'https://freight.cargo.site/t/original/i/K2793520152553013157971796217662/25_13_R_DoD_B.jpeg';
  var MAX_SCALE = 4;
  var ZOOM_FACTOR = 0.08;

  var viewer = document.getElementById('viewer');
  var img = document.getElementById('map');
  var loading = document.getElementById('loading');

  var scale = 1;
  var minScale = 1;
  var tx = 0, ty = 0;
  var dragging = false;
  var startX, startY, startTx, startTy;

  function clampPan() {
    var vw = viewer.clientWidth;
    var vh = viewer.clientHeight;
    var iw = img.naturalWidth * scale;
    var ih = img.naturalHeight * scale;

    if (iw > vw) {
      if (tx > 0) tx = 0;
      if (tx < vw - iw) tx = vw - iw;
    } else {
      tx = (vw - iw) / 2;
    }

    if (ih > vh) {
      if (ty > 0) ty = 0;
      if (ty < vh - ih) ty = vh - ih;
    } else {
      ty = (vh - ih) / 2;
    }
  }

  function applyTransform() {
    clampPan();
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
  }

  function fitImage() {
    var vw = viewer.clientWidth;
    var vh = viewer.clientHeight;
    var iw = img.naturalWidth;
    var ih = img.naturalHeight;
    minScale = Math.max(vw / iw, vh / ih);
    scale = minScale;
    tx = (vw - iw * scale) / 2;
    ty = (vh - ih * scale) / 2;
    applyTransform();
  }

  function zoomAt(cx, cy, direction) {
    var prev = scale;
    var factor = direction > 0 ? (1 + ZOOM_FACTOR) : (1 - ZOOM_FACTOR);
    scale = Math.min(MAX_SCALE, Math.max(minScale, scale * factor));
    if (scale === prev) return;
    var ratio = scale / prev;
    tx = cx - (cx - tx) * ratio;
    ty = cy - (cy - ty) * ratio;
    applyTransform();
  }

  img.onload = function() {
    loading.style.display = 'none';
    fitImage();
  };
  img.src = IMAGE_URL;

  viewer.addEventListener('wheel', function(e) {
    e.preventDefault();
    var d = e.deltaY > 0 ? -1 : 1;
    var rect = viewer.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, d);
  }, { passive: false });

  viewer.addEventListener('mousedown', function(e) {
    dragging = true;
    startX = e.clientX; startY = e.clientY;
    startTx = tx; startTy = ty;
    viewer.classList.add('grabbing');
  });
  window.addEventListener('mousemove', function(e) {
    if (!dragging) return;
    tx = startTx + (e.clientX - startX);
    ty = startTy + (e.clientY - startY);
    applyTransform();
  });
  window.addEventListener('mouseup', function() {
    dragging = false;
    viewer.classList.remove('grabbing');
  });

  var lastDist = 0;
  viewer.addEventListener('touchstart', function(e) {
    if (e.touches.length === 1) {
      dragging = true;
      startX = e.touches[0].clientX; startY = e.touches[0].clientY;
      startTx = tx; startTy = ty;
    } else if (e.touches.length === 2) {
      dragging = false;
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      lastDist = Math.sqrt(dx*dx + dy*dy);
    }
  }, { passive: false });
  viewer.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1 && dragging) {
      tx = startTx + (e.touches[0].clientX - startX);
      ty = startTy + (e.touches[0].clientY - startY);
      applyTransform();
    } else if (e.touches.length === 2) {
      var dx = e.touches[0].clientX - e.touches[1].clientX;
      var dy = e.touches[0].clientY - e.touches[1].clientY;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      var cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      var rect = viewer.getBoundingClientRect();
      zoomAt(cx - rect.left, cy - rect.top, dist > lastDist ? 1 : -1);
      lastDist = dist;
    }
  }, { passive: false });
  viewer.addEventListener('touchend', function() { dragging = false; });

  document.getElementById('zoomIn').addEventListener('click', function() {
    zoomAt(viewer.clientWidth / 2, viewer.clientHeight / 2, 1);
  });
  document.getElementById('zoomOut').addEventListener('click', function() {
    zoomAt(viewer.clientWidth / 2, viewer.clientHeight / 2, -1);
  });

  window.addEventListener('resize', fitImage);
})();
</script>
</body>
</html>
